<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalar | Escolas Bíblicas</title>
    <style>
        /* ── Theme Tokens ────────────────────────────────────── */
        :root {
            --bg-base: #0c0c0e;
            --bg-surface: #111114;
            --bg-elevated: #18181c;
            --bg-hover: #1f1f24;
            --border: #232328;
            --border-strong: #2e2e36;
            --text-primary: #e8e8ec;
            --text-secondary: #8a8a96;
            --text-tertiary: #52525c;
            --accent: #5b6af0;
            --accent-hover: #6b79f5;
            --accent-muted: rgba(91, 106, 240, 0.12);
            --accent-border: rgba(91, 106, 240, 0.22);
            --code-bg: #050505;
        }

        /* ── Base Reset ─────────────────────────────────────── */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            text-align: center;
        }

        .eb-surface {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px 0; }
        .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 32px; }

        .os-badge {
            display: inline-flex;
            padding: 4px 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-tertiary);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .eb-btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: var(--accent-muted);
            border: 1px solid var(--accent-border);
            color: var(--accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .eb-btn-primary:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 8px 14px;
            background: transparent;
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--accent-border);
            color: var(--accent);
        }

        .instructions-box {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: left;
        }

        .eb-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 10px;
            display: block;
        }

        .instruction-text { font-size: 12px; line-height: 1.6; color: var(--text-secondary); }

        code {
            display: block;
            background: var(--code-bg);
            border: 1px solid var(--border-strong);
            padding: 12px;
            border-radius: 6px;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
            color: var(--text-primary);
            margin: 10px 0;
            word-break: break-all;
            cursor: pointer;
            position: relative;
        }

        code:hover::after {
            content: "Clique para copiar";
            position: absolute;
            top: -20px; right: 0;
            font-size: 9px;
            color: var(--accent);
        }

        .footer-links { margin-top: 24px; display: flex; justify-content: center; gap: 16px; }
        .footer-links a { font-size: 12px; color: var(--text-tertiary); text-decoration: none; }
        .footer-links a:hover { color: var(--text-secondary); }

        .loading-state { color: var(--text-tertiary); font-size: 13px; }
        .error-state { color: #e05c5c; font-size: 13px; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading" class="loading-state">Carregando...</div>
        <div id="error" class="error-state hidden">Erro ao carregar dados. <a href="https://github.com/igor-rl/escolas-biblicas-app/releases/latest" style="color:inherit">Ver releases</a>.</div>

        <div id="download-area" class="hidden">
            <div class="eb-surface">
                <div class="os-badge" id="os-label">Detectando...</div>
                <h1>Escolas Bíblicas</h1>
                <p class="subtitle">v<span id="version-number">0.0.0</span> — Desktop</p>

                <a href="#" id="main-download-btn" class="eb-btn-primary">
                    Baixar para <span id="btn-os">Sistema</span>
                </a>

                <!-- Botão alternativo (ex: macOS Intel quando detectou arm64) -->
                <a href="#" id="alt-download-btn" class="btn-secondary hidden">
                    <span id="alt-btn-text">Versão alternativa</span>
                </a>

                <div class="instructions-box">
                    <span class="eb-label" id="instruction-title">Instalação</span>
                    <div id="instruction-content" class="instruction-text"></div>
                </div>
            </div>

            <div class="footer-links">
                <a href="https://github.com/igor-rl/escolas-biblicas-app/releases">Todas as versões</a>
            </div>
        </div>
    </div>

    <script>
        // ─────────────────────────────────────────────────────────────
        // REPO PÚBLICO — onde ficam as releases e os binários
        // ─────────────────────────────────────────────────────────────
        const REPO = "igor-rl/escolas-biblicas-app";

        function getDetailedOS() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes("win")) return { os: "windows", arch: "x64" };
            if (ua.includes("mac")) {
                // Heurística: tenta detectar Apple Silicon via WebGL renderer
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                let isAppleSilicon = false;
                if (gl) {
                    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                    if (dbg) {
                        const renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "";
                        if (renderer.toLowerCase().includes("apple")) isAppleSilicon = true;
                    }
                }
                return { os: "macos", arch: isAppleSilicon ? "arm64" : "x64" };
            }
            return { os: "unknown", arch: "x64" };
        }

        function assetUrl(version, filename) {
            return `https://github.com/${REPO}/releases/download/v${version}/${filename}`;
        }

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const release = await res.json();
                const version = release.tag_name.replace('v', '');
                const info = getDetailedOS();

                const ui = {
                    version:    document.getElementById('version-number'),
                    label:      document.getElementById('os-label'),
                    btn:        document.getElementById('main-download-btn'),
                    btnOs:      document.getElementById('btn-os'),
                    altBtn:     document.getElementById('alt-download-btn'),
                    altBtnText: document.getElementById('alt-btn-text'),
                    content:    document.getElementById('instruction-content'),
                };

                ui.version.innerText = version;

                if (info.os === "windows") {
                    ui.label.innerText  = "Windows (x64)";
                    ui.btnOs.innerText  = "Windows";
                    ui.btn.href = assetUrl(version, `Escolas-Biblicas-windows-installer-${version}.exe`);

                    // Botão alternativo: versão portátil
                    ui.altBtn.href = assetUrl(version, `Escolas-Biblicas-windows-portable-${version}.exe`);
                    ui.altBtnText.innerText = "↓ Versão portátil (sem instalação)";
                    ui.altBtn.classList.remove('hidden');

                    ui.content.innerHTML = "Execute o instalador e siga os passos na tela.";
                }
                else if (info.os === "macos") {
                    const altArch = info.arch === "arm64" ? "x64" : "arm64";
                    const altLabel = altArch === "arm64" ? "Apple Silicon" : "Intel";

                    ui.label.innerText = `macOS ${info.arch === "arm64" ? "Apple Silicon" : "Intel"}`;
                    ui.btnOs.innerText = "macOS";
                    ui.btn.href = assetUrl(version, `Escolas-Biblicas-macOS-${version}-${info.arch}.dmg`);

                    // Botão alternativo: outra arquitetura
                    ui.altBtn.href = assetUrl(version, `Escolas-Biblicas-macOS-${version}-${altArch}.dmg`);
                    ui.altBtnText.innerText = `↓ Versão para Mac ${altLabel}`;
                    ui.altBtn.classList.remove('hidden');

                    const cmd = `xattr -rd com.apple.quarantine '/Applications/Escolas Biblicas.app' && open '/Applications/Escolas Biblicas.app'`;

                    ui.content.innerHTML = `
                        1. Abra o <b>.dmg</b> e arraste o app para <b>Aplicativos</b>.<br><br>
                        2. Como o app não é assinado pela App Store, o macOS irá bloqueá-lo na primeira abertura.
                        Para liberar, abra o <b>Terminal</b> e rode:
                        <code onclick="navigator.clipboard.writeText(this.innerText).then(() => alert('Comando copiado!'))">${cmd}</code>
                        Ou vá em <b>Ajustes do Sistema → Privacidade e Segurança</b> e clique em <b>"Abrir mesmo assim"</b>.
                    `;
                }
                else {
                    ui.label.innerText = "Sistema não identificado";
                    ui.btn.href = `https://github.com/${REPO}/releases/latest`;
                    ui.btnOs.innerText = "ver releases";
                    ui.content.innerHTML = "Acesse a página de releases e baixe o arquivo para o seu sistema.";
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('download-area').classList.remove('hidden');
            } catch (e) {
                console.error(e);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        init();
    </script>
</body>
</html>
