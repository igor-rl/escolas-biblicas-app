<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalar | Escolas Bíblicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="eb-navbar">
        <a href="home.html" class="eb-navbar-brand">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5.5c-1.6-1.3-3.6-2-6-2-.5 0-1 .05-1.5.15v13c.5-.1 1-.15 1.5-.15 2.4 0 4.4.7 6 2 1.6-1.3 3.6-2 6-2 .5 0 1 .05 1.5.15v-13c-.5-.1-1-.15-1.5-.15-2.4 0-4.4.7-6 2z" />
                <path d="M12 5.5v13" />
            </svg>
            Escolas Bíblicas
        </a>
        <div class="eb-navbar-links">
            <a href="home.html" class="eb-navbar-link">Início</a>
            <a href="index.html" class="eb-navbar-link active">Baixar</a>
            <a href="privacidade.html" class="eb-navbar-link">Privacidade</a>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <div id="loading">Sincronizando...</div>

            <div id="download-area" class="hidden">
                <div class="eb-surface">
                    <div class="os-badge" id="os-label">Detectando...</div>
                    <h1>Escolas Bíblicas</h1>
                    <p class="subtitle">v<span id="version-number">0.0.0</span> — Desktop</p>

                    <a href="#" id="main-download-btn" class="eb-btn-primary">Baixar para&nbsp;<span id="btn-os">Sistema</span></a>

                    <div class="instructions-box">
                        <span class="eb-label" id="instruction-title">Instalação</span>
                        <div id="instruction-content" class="instruction-text"></div>
                    </div>
                </div>

                <div class="footer-links">
                    <a href="https://github.com/igor-rl/escolas-biblicas-app/releases">Encontre mais versões do app</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const REPO = "igor-rl/escolas-biblicas-app";

        function getDetailedOS() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes("win")) return { os: "windows", arch: "x64" };
            if (ua.includes("mac")) {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                let isAppleSilicon = false;
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "";
                    if (renderer.includes("Apple")) isAppleSilicon = true;
                }
                return { os: "macos", arch: isAppleSilicon ? "arm64" : "x64" };
            }
            return { os: "unknown", arch: "x64" };
        }

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
                const release = await res.json();
                const version = release.tag_name.replace('v', '');
                const info = getDetailedOS();
                
                const ui = {
                    version: document.getElementById('version-number'),
                    label: document.getElementById('os-label'),
                    btn: document.getElementById('main-download-btn'),
                    btnText: document.getElementById('btn-os'),
                    content: document.getElementById('instruction-content')
                };

                ui.version.innerText = version;

                if (info.os === "windows") {
                    ui.label.innerText = "Windows (x64)";
                    ui.btnText.innerText = "Windows";
                    ui.btn.href = `https://github.com/${REPO}/releases/download/v${version}/Escolas-Biblicas-windows-installer-${version}.exe`;
                    ui.content.innerHTML = "Execute o instalador e siga os passos na tela.";
                } 
                else if (info.os === "macos") {
                    const isApple = info.arch === "arm64";
                    ui.label.innerText = `macOS ${isApple ? "Apple Silicon" : "Intel"}`;
                    
                    // Ajuste do texto do botão com espaço
                    ui.btnText.innerText = `macOS (${isApple ? "Apple Silicon" : "Intel"})`;
                    
                    // Link dinâmico baseado na arquitetura
                    ui.btn.href = `https://github.com/${REPO}/releases/download/v${version}/Escolas-Biblicas-macOS-${version}-${info.arch}.dmg`;
                    
                    const cmd = `xattr -rd com.apple.quarantine '/Applications/Escolas Biblicas.app' && open '/Applications/Escolas Biblicas.app'`;
                    
                    ui.content.innerHTML = `
                        1. Abra o <b>.dmg</b> e arraste o app para <b>Aplicativos</b>.<br>
                        2. Como o app não é assinado, o macOS irá bloqueá-lo. Para liberar, copie e rode o comando abaixo no <b>Terminal</b>:
                        <code onclick="navigator.clipboard.writeText(this.innerText); alert('Copiado!')">${cmd}</code>
                        Ou vá em <b>Ajustes do Sistema → Privacidade e Segurança</b> e clique em <b>"Abrir mesmo assim"</b>.
                    `;
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('download-area').classList.remove('hidden');
            } catch (e) {
                document.getElementById('loading').innerText = "Erro ao carregar dados.";
            }
        }
        init();
    </script>
</body>
</html>
